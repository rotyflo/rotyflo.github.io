<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>rt flores</title>

	<link rel="stylesheet" href="../css/index.css">
</head>

<body>
	<main>
		<strong>get local ip address</strong>
		<br><br>
		<fieldset>
			<legend>linux</legend>
			<small>
				<samp>hostname -I | awk '{print $1}'</samp>
			</small>
		</fieldset>
		<br>
		<fieldset>
			<legend>macos</legend>
			<small>
				<samp>ifconfig | grep "inet " | grep -Fv 127.0.0.1 | awk '{print $2}'</samp>
			</small>
		</fieldset>
		<br>
		<fieldset>
			<legend>windows</legend>
			<small>
				<samp>for /f "tokens=14" %a in ('ipconfig ^| findstr IPv4') do echo %a</samp>
			</small>
		</fieldset>
	</main>
</body>

</html>
